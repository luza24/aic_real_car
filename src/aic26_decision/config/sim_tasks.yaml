# Simulation inspection mission for the AIC26 Smart Community demo scene.
# Selected by mission.launch when backend:=sim (the default); the real-robot
# counterpart is real_tasks.yaml.
#
# Each task is executed in order by mission_controller.py:
#   type: goto           navigate to waypoint, then continue
#   type: traffic_light  turn (optional), wait at the stop line until GREEN, pass
#   type: inspect        navigate, turn, dwell, trigger detection, report
#   type: report         announce the collected results (no motion)
#
# The waypoint sequence mirrors config/sim_screenshot_cycle.yaml (the dataset
# route) so the captured images are taken from the same viewpoints as the
# simulation run. This file keeps the real detectors, screenshot_cycle fakes
# them.
#
# Fields:
#   waypoint   target name in sim_waypoints.yaml
#   turn       rotate in place before waiting/detecting: "left", "right" or
#              omitted (in place cmd_vel rotation, the navigation stack is not
#              used); the waypoint heading is restored afterwards
#   dwell      seconds to stay still at the target (default 0)
#   wait       max seconds to wait for GREEN at a traffic light (default 30)
#   light      traffic light model to watch, e.g. traffic_light_1
#   target     detection target name sent to the perception node
#   message    announcement template
#
# People groups:
#   p1,p3,p5,p7        left of station_2
#   p9,p11,p13,p15     left of station_1
#   pF1,pF2            left of station_3  (non-community)
#   p2,p4,p6,p8        right of station_3
#   p10,p12,p14,p16    right of traffic_light_2

robot: armbot

tasks:
  - name: "leave_start"
    type: goto
    waypoint: "corner_1"

  - name: "light_1"
    type: traffic_light
    waypoint: "traffic_light_1"
    light: "traffic_light_1"
    wait: 40

  - name: "people_b"
    type: inspect
    waypoint: "station_1"
    turn: "left"
    dwell: 2.0
    target: "people"
    message: "Zone B people inspection finished."

  - name: "people_a"
    type: inspect
    waypoint: "station_2"
    turn: "left"
    dwell: 2.0
    target: "people"
    message: "Zone A people inspection finished."

  - name: "people_f"
    type: inspect
    waypoint: "station_3"
    turn: "left"
    dwell: 2.0
    target: "people"
    message: "Zone F people inspection finished."

  - name: "people_c"
    type: inspect
    waypoint: "station_3"
    turn: "right"
    dwell: 2.0
    target: "people"
    message: "Zone C people inspection finished."

  - name: "people_d"
    type: inspect
    waypoint: "traffic_light_2"
    turn: "right"
    dwell: 2.0
    target: "people"
    message: "Zone D people inspection finished."

  - name: "light_2"
    type: traffic_light
    waypoint: "traffic_light_2"
    light: "traffic_light_2"
    wait: 40

  - name: "car_1"
    type: inspect
    waypoint: "car_1"
    dwell: 2.0
    target: "car"
    message: "Car 1 inspection finished."

  - name: "car_2"
    type: inspect
    waypoint: "car_2"
    turn: "right"
    dwell: 2.0
    target: "car"
    message: "Car 2 inspection finished."

  - name: "car_3"
    type: inspect
    waypoint: "car_3"
    turn: "right"
    dwell: 2.0
    target: "car"
    message: "Car 3 inspection finished."

  - name: "return_back"
    type: goto
    waypoint: "corner_1"

  - name: "return_home"
    type: goto
    waypoint: "start"

  - name: "summarize"
    type: report
    message: "Inspection complete, reporting results."
