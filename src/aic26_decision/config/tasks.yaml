# Inspection mission for the AIC26 Smart Community demo scene.
#
# Each task is executed in order by mission_controller.py:
#   type: goto           navigate to waypoint, then continue
#   type: traffic_light  wait at the stop line until GREEN, then pass
#   type: inspect        navigate, dwell, trigger detection, collect result
#   type: report         announce the collected results (no motion)
#
# Fields:
#   waypoint   target name in waypoints.yaml
#   dwell      seconds to stay still at the target (default 0)
#   wait       max seconds to wait for GREEN at a traffic light (default 30)
#   light      traffic light model to watch, e.g. traffic_light_1
#   target     detection target name sent to the perception stub
#   message    announcement template, {value} is filled by the detection

robot: armbot

tasks:
  - name: "leave_start"
    type: goto
    waypoint: "corner_1"

  - name: "light_1"
    type: traffic_light
    waypoint: "traffic_light_1"
    light: "traffic_light_1"
    wait: 40

  - name: "zone_a"
    type: inspect
    waypoint: "station_1"
    dwell: 2.0
    target: "people"
    message: "Community zone A inspection finished."

  - name: "light_2"
    type: traffic_light
    waypoint: "traffic_light_2"
    light: "traffic_light_2"
    wait: 40

  - name: "zone_b"
    type: inspect
    waypoint: "station_2"
    dwell: 2.0
    target: "plate"
    message: "Community zone B inspection finished."

  - name: "return_home"
    type: goto
    waypoint: "start"

  - name: "summarize"
    type: report
    message: "Inspection complete, reporting results."
