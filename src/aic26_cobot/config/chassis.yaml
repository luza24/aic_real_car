# STM32 four-wheel chassis on the USB-serial adapter /dev/carserial.
# The protocol is the 12-byte AA BB 0A 12 02 frame used by the car.
port: /dev/carserial
baud: 115200

cmd_topic: /cmd_vel
vel_topic: /vel_raw
odom_topic: /odom

odom_frame: odom
base_frame: base_footprint
publish_tf: true

# Start odometry at the Gazebo spawn pose (1.6, 1.7, pi). With AMCL using
# the same initial pose this makes map->odom identity, so the real robot,
# the odom frame and the local costmap appear at the same place in RViz as
# in the simulation instead of starting at (0, 0).
initial_x: 1.6
initial_y: 1.7
initial_yaw: 3.141592

# 20 Hz matches the STM32 feedback stream (measured ~19.6 Hz) and the
# simulation odometry. The serial adapter delivers frames in bursts, so the
# node integrates each frame with 1/feedback_rate instead of the wall-clock
# arrival interval. publish_rate is the odom/TF rate; cmd_rate is the rate at
# which speed frames are written to the STM32 (the old working sender used
# about 10 Hz).
publish_rate: 30.0
cmd_rate: 10.0
feedback_rate: 20.0
feedback_dt_max: 0.2

# Ignore encoder quantization and electrical noise at standstill.
linear_deadband: 0.002
angular_deadband: 0.002

# Stop the motors when /cmd_vel stops arriving while this node is alive.
# The STM32 firmware must also implement its own command timeout (300 ms is a
# good value); a host-side node cannot stop the motors after it has died.
cmd_timeout: 0.5

# Do not publish a stale chassis velocity for longer than this.
feedback_timeout: 1.0

# The STM32 UART parser drops whole commands when the 12 bytes arrive in one
# write; the old car_bringup sender used a 0.4 ms gap between bytes.
byte_delay: 0.0004

# Legacy 0x11 + 8x00 handshake, sent after opening the port and on reconnect.
# Without it the motors ignore speed frames until the motor power is cycled.
send_init: true
init_delay: 0.001

linear_cmd_scale: 1.0
angular_cmd_scale: 1.0
linear_odom_scale: 1.0
angular_odom_scale: 1.0
max_linear: 0.5
max_angular: 1.5

# Fuse the WIT gyro z rate into the chassis yaw integration. The gyro is
# rate-only (not the magnetic yaw), so it is stable indoors. A standstill
# bias estimate is folded in, and a small encoder share keeps the long-term
# scale honest. The old car_bringup EKF fused the same gyro z rate.
use_imu_yaw: true
imu_topic: /imu/data
imu_timeout: 0.2
imu_gyro_gain: 0.95
imu_gyro_sign: 1.0
imu_gyro_bias_alpha: 0.02
imu_gyro_bias_limit: 0.15
