GlobalPlanner:
  allow_unknown: true
  default_tolerance: 0.1
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  lethal_cost: 253
  neutral_cost: 50
  # stock global_planner dynamic reconfigure caps cost_factor at 5.0;
  # values above 5 are clamped back to 5 at runtime.
  cost_factor: 5.0
  publish_potential: true
