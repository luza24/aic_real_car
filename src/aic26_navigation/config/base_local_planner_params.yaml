TrajectoryPlannerROS:
  meter_scoring: true
  max_vel_x: 0.3
  min_vel_x: -0.3
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.3
  acc_lim_x: 1.5
  acc_lim_theta: 2.0

  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.08
  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 10
  vtheta_samples: 20