TebLocalPlannerROS:

  max_vel_x: 0.4
  max_vel_x_backwards: 0.3
  # The chassis is omnidirectional: the STM32 command frame carries vx, vy and
  # wz, so the planner may translate sideways instead of only rotating towards
  # the path. A non-zero max_vel_y also switches TEB to its holonomic robot
  # model (velocities are no longer constrained to the x axis).
  max_vel_y: 0.3
  max_vel_theta: 1.2
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  acc_lim_theta: 1.6

  footprint_model:
    type: "polygon"
    vertices: [[-0.142, -0.136], [-0.142, 0.136], [0.142, 0.136], [0.142, -0.136]]

  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.12
  free_goal_vel: false

  # Must be zero for a holonomic robot, otherwise the optimizer still penalises
  # any velocity component that is not along the robot's heading and the
  # lateral velocity stays at zero. forward_drive only biases the x axis, so
  # keeping it makes the robot prefer driving forwards while still allowing
  # strafing.
  weight_kinematics_nh: 0.0
  weight_kinematics_forward_drive: 0.0

  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  max_samples: 200

  global_plan_viapoint_sep: 0.3
  via_points_ordered: false
  weight_viapoint: 50.0
  weight_shortest_path: 1.0

  min_obstacle_dist: 0.12
  inflation_dist: 0.20
  weight_obstacle: 12.0
  weight_inflation: 0.6
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5

  weight_optimaltime: 1.2
  no_inner_iterations: 6
  no_outer_iterations: 4

  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: true
  max_global_plan_lookahead_dist: 1.2
  feasibility_check_no_poses: 3
  publish_feedback: false


