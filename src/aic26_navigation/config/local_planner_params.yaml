TebLocalPlannerROS:

  max_vel_x: 0.4
  max_vel_x_backwards: 0.3
  max_vel_theta: 1.2
  acc_lim_x: 1.0
  acc_lim_theta: 1.6

  footprint_model:
    type: "polygon"
    vertices: [[-0.142, -0.136], [-0.142, 0.136], [0.142, 0.136], [0.142, -0.136]]

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  free_goal_vel: false

  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 0.0

  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  max_samples: 200

  global_plan_viapoint_sep: 0.3
  via_points_ordered: true
  weight_viapoint: 50.0
  weight_shortest_path: 1.0

  min_obstacle_dist: 0.12
  inflation_dist: 0.25
  weight_obstacle: 50.0
  weight_inflation: 1.0
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5

  weight_optimaltime: 1.0
  no_inner_iterations: 4
  no_outer_iterations: 3

  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: true
  max_global_plan_lookahead_dist: 1.5
  feasibility_check_no_poses: 3
  publish_feedback: false


