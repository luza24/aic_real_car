footprint: $(arg footprint)
footprint_padding: 0.0

obstacle_layer:
  observation_sources: scan
  scan:
    topic: /scan
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: LaserScan
    inf_is_valid: true
    obstacle_range: 3.0
    raytrace_range: 3.5

virtual_walls:
  map_topic: /virtual_walls
  lethal_cost_threshold: 50
  trinary_costmap: true
  track_unknown_space: false
  subscribe_to_updates: false
  use_maximum: true

static_layer:
  map_topic: /map
