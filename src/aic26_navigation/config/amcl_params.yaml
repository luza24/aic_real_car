use_map_topic: false
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map

# Resource tuning for the Intel N100. The particle counts and KLD target are
# reduced moderately; the laser model, resampling interval and update
# thresholds are unchanged, so the pose estimate stays accurate.
min_particles: 300
max_particles: 1200
kld_err: 0.08
kld_z: 0.99
# Do not publish a new map->odom correction on every scan. 0.1 m / 0.1 rad
# still tracks the odometry smoothly but removes the high-frequency
# back-and-forth corrections that look like a shaking robot in RViz.
update_min_d: 0.10
update_min_a: 0.10
resample_interval: 1
transform_tolerance: 0.5
# Only affects the particle cloud shown in RViz, not localization.
gui_publish_rate: 2.0
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1

laser_model_type: likelihood_field
# 45 of the 720 scan beams is enough for the likelihood field; 60 (the AMCL
# default) costs about 33% more likelihood evaluations per update.
laser_max_beams: 45
laser_likelihood_max_dist: 2.0
laser_max_range: 12.0
laser_min_range: 0.1

set_initial_pose: true
initial_pose_x: 1.6
initial_pose_y: 1.7
initial_pose_a: 3.141592
# The real robot is placed by hand; the start position can be off by
# 0.1-0.2 m and several degrees. The old 0.0004 covariance (2 cm / 1.1 deg)
# made AMCL trust the nominal (1.6, 1.7, pi) pose and ignore the scan
# mismatch. 0.03 gives a 17 cm / 9.9 deg standard deviation so the first
# scan can correct the placement while still keeping the estimate local.
initial_cov_xx: 0.03
initial_cov_yy: 0.03
initial_cov_aa: 0.03
